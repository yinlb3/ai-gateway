# ==========================================================================
# LiteLLM gateway configuration - example
# ==========================================================================
#
# Copy this file to config.yaml, fill in the values, then run
# run_gateway.bat. The live file is ignored by git; this one is committed
# and must stay free of credentials.
#
# The gateway forwards requests and hands each finished one to
# custom_callback.py, which writes a raw line. Accounting never blocks a
# request.
#
# ==========================================================================
# Where credential values go
# ==========================================================================
#
# Either write the value straight into api_key, or write
# os.environ/NAME and put NAME in the environment_variables block below.
# A .env file is not read: LiteLLM loads one only when LITELLM_MODE=DEV.
#
# Two are read from the environment only, they have no config.yaml key:
#
#   LITELLM_MASTER_KEY   admin key, must start with sk-
#   LITELLM_SALT_KEY     encrypts stored credentials in Postgres; set it
#                        once and never change it
#
# ==========================================================================
# Adding a provider, or another key
# ==========================================================================
#
# A second provider: add a block.
#
#     - model_name: openai/gpt-4o
#       litellm_params:
#         model: openai/gpt-4o
#         api_key: os.environ/OPENAI_API_KEY
#       model_info:
#         id: gpt-4o
#
# Several keys for one model: write the same model_name again. Identical
# names form one pool, so requests are shared out and a failing key is
# stepped over. Give each block a distinct model_info.id.
#
# Telling tools apart is not done here: that is what virtual keys are
# for. See docs/key_setup_cn.md.

#
# A model_name no entry in config/pricing.yaml maps is reported under
# unknown_models and never billed as zero, so adding a provider also
# means adding its prices.

model_list:

  # model_name is what the log record stores, and it must match a key in
  # config/pricing.yaml, or the report cannot price those requests.
  #
  # api_key takes the value itself, or os.environ/NAME with NAME in the
  # environment_variables block above.
  #
  # Several keys for one model: repeat the block with the same model_name.
  # Identical names form one pool, so requests are shared out and a failing
  # key is stepped over. Give each block a distinct model_info.id.
  - model_name: deepseek/deepseek-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      id: deepseek-flash

  # Priced in pricing.yaml, but no key of its own is issued here. The
  # deployment is declared so the entry exists and a key can be dropped
  # in without touching anything else.
  - model_name: deepseek/deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_base: https://api.deepseek.com
      api_key: os.environ/DEEPSEEK_API_KEY
    model_info:
      id: deepseek-v4-pro

# Retired names stay callable, pointed at the live model. The log records
# the target name, so the price table needs no entry for the old ones.
#
# This block is the only place an alias takes effect: model_info is a
# plain dict and an aliases list written there is ignored.

router_settings:
  model_group_alias:
    deepseek/deepseek-v4-flash: deepseek/deepseek-flash
    deepseek/deepseek-v4-flash-vision-exp: deepseek/deepseek-flash

litellm_settings:

  # Load custom_callback.py from the project root as proxy_handler_instance.
  callbacks: custom_callback.proxy_handler_instance

  # Upstream retries. Does not control callback behaviour: the accounting
  # path is isolated by custom_callback.py catching its own errors.
  num_retries: 2


general_settings:

  # Required for virtual keys, which is what attributes spend to a tool.
  # The accounting never reads it: raw records go to logs/ as JSONL.
  database_url: os.environ/DATABASE_URL

  # Admin key, also the one that authorizes POST /key/generate.
  master_key: os.environ/LITELLM_MASTER_KEY

  # Set to [] when clients reach the proxy directly. Left unset, LiteLLM
  # warns at startup and only the weaker login limit applies.
  trusted_proxy_ranges: []

# ==========================================================================
# Virtual keys and project attribution
# ==========================================================================
#
# A request is attributed in one of two ways, first match wins.
#
# 1. Header, for tools that can send one:
#
#      x-litellm-spend-logs-metadata: {"project":"wind-forecast"}
#
# 2. Virtual key alias, for tools that only get a different api_key:
#
#      key_alias = "<tool>--<project>"      e.g. codex--wind-forecast
#
#    The callback splits on the first "--". This is the main path.
#
# Alias naming rules:
#   - lowercase letters and hyphens only, no spaces and no Chinese
#   - one project per key, so N projects means N keys
#   - the project part must not itself contain "--"
#
# A request with neither signal is still forwarded and recorded, landing
# with user=null and partial=true, so a missing project shows up in the
# report as a gap rather than as a silent zero.

